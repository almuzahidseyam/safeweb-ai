<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafeWeb AI</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><h1>SafeWeb AI</h1><p>Local browsing tools</p></header>
  <main>
    <label class="setting"><span><strong>Image blur</strong><small>Flag likely explicit images</small></span><input type="checkbox" id="toggle-privacy"></label>
    <label class="setting"><span><strong>URL warnings</strong><small>Check unusual address patterns</small></span><input type="checkbox" id="toggle-phishing"></label>
    <section aria-label="Current page"><h2>On this page</h2><p id="status" role="status" aria-live="polite">Checking availability…</p></section>
    <button id="scan-now">Scan images again</button>
    <p class="note">Experimental assistance. Unscanned images and missed threats are possible. A quiet result does not mean a page is safe.</p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
