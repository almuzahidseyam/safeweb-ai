name: Release verified extension
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SafeWebAI-Extension
          path: extension
      - run: cd extension && zip -r ../SafeWebAI.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: SafeWebAI-Zip
          path: SafeWebAI.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: SafeWebAI.zip
